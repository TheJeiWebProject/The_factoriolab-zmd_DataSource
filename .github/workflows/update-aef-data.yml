name: Update AEF Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      adaptive_split:
        description: 'Enable adaptive image slicing'
        required: false
        type: boolean
        default: true
      target_scale:
        description: 'Target scale used for source->logical tile conversion'
        required: false
        type: number
        default: 1
      edge_policy:
        description: 'Edge tile policy'
        required: false
        type: choice
        options:
          - crop
          - pad
        default: crop
      base_tile:
        description: 'Optional logical tile override at target scale (empty = auto-derived)'
        required: false
        type: string
        default: ''
      force_update:
        description: 'Force rebuild and overwrite previously generated data even when upstream commit is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout upstream factoriolab
        uses: actions/checkout@v4
        with:
          repository: endfield-calc/factoriolab
          ref: ark-endfield-3rd-test
          path: upstream
          fetch-depth: 1

      - name: Capture upstream commit
        id: upstream
        run: echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read previous upstream commit
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          prev=""
          if [ -f UPSTREAM_SNAPSHOT.json ]; then
            prev="$(sed -n 's/.*"upstreamCommit":[[:space:]]*"\([^"]*\)".*/\1/p' UPSTREAM_SNAPSHOT.json | head -n1)"
          fi
          echo "sha=$prev" >> "$GITHUB_OUTPUT"

      - name: Compare upstream commits
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_UPDATE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_update || false }}
        run: |
          set -euo pipefail
          current="${{ steps.upstream.outputs.sha }}"
          previous="${{ steps.previous.outputs.sha }}"

          if [ -n "$current" ] && [ "$current" = "$previous" ]; then
            changed='false'
          else
            changed='true'
          fi

          should_build='false'
          force_build='false'
          reason='default: no build'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$FORCE_UPDATE_INPUT" = 'true' ]; then
            should_build='true'
            force_build='true'
            reason='manual force_update=true (ignore unchanged upstream commit)'
          elif [ "$changed" = 'true' ]; then
            should_build='true'
            reason='upstream changed'
          else
            reason='upstream unchanged'
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "force_build=$force_build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          echo "Workflow event: $EVENT_NAME"
          echo "force_update: $FORCE_UPDATE_INPUT"
          echo "upstream commit: ${current:-<empty>}"
          echo "previous commit: ${previous:-<empty>}"
          echo "upstream changed: $changed"
          echo "force build: $force_build"
          echo "final build decision (should_build): $should_build"
          echo "decision reason: $reason"

      - name: Setup Node.js
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check.outputs.should_build == 'true'
        run: npm install

      - name: Inherit upstream LICENSE
        if: steps.check.outputs.should_build == 'true'
        run: cp upstream/LICENSE UPSTREAM_LICENSE

      - name: Build AEF pack
        if: steps.check.outputs.should_build == 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.sha }}
          INPUT_ADAPTIVE_SPLIT: ${{ github.event_name == 'workflow_dispatch' && (inputs.adaptive_split && 'true' || 'false') || 'true' }}
          INPUT_TARGET_SCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_scale || '1' }}
          INPUT_EDGE_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.edge_policy || 'crop' }}
          INPUT_BASE_TILE: ${{ github.event_name == 'workflow_dispatch' && inputs.base_tile || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "--source" "upstream/src/data/aef/data.json"
            "--out-dir" "dist"
            "--target-scale" "${INPUT_TARGET_SCALE}"
            "--edge-policy" "${INPUT_EDGE_POLICY}"
          )
          if [ "${INPUT_ADAPTIVE_SPLIT}" = "true" ]; then
            args+=("--adaptive-split")
          else
            args+=("--no-adaptive-split")
          fi
          if [ -n "${INPUT_BASE_TILE}" ]; then
            args+=("--base-tile" "${INPUT_BASE_TILE}")
          fi

          echo "Build config: adaptive_split=${INPUT_ADAPTIVE_SPLIT} target_scale=${INPUT_TARGET_SCALE} edge_policy=${INPUT_EDGE_POLICY} base_tile=${INPUT_BASE_TILE:-<auto>}"
          node src/build-aef-pack.mjs "${args[@]}"

      - name: Validate adaptive split outputs
        if: steps.check.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.adaptive_split == true)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const outDir = path.resolve('dist');
          const manifestPath = path.join(outDir, 'image-slice-manifest.json');
          if (!fs.existsSync(manifestPath)) {
            throw new Error(`adaptive split enabled but manifest missing: ${manifestPath}`);
          }
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!Array.isArray(manifest.tiles) || manifest.tiles.length === 0) {
            throw new Error('adaptive split enabled but no tiles recorded in manifest');
          }
          const firstTile = manifest.tiles[0];
          const firstTilePath = path.join(outDir, 'tiles', firstTile.filename);
          if (!fs.existsSync(firstTilePath)) {
            throw new Error(`manifest tile file missing: ${firstTilePath}`);
          }
          const items = JSON.parse(fs.readFileSync(path.join(outDir, 'items.json'), 'utf8'));
          const iconSpriteItems = items.filter((item) => item.iconSprite && item.iconSprite.url);
          const unsliced = iconSpriteItems.filter((item) => item.iconSprite.url.endsWith('icons.webp'));
          if (unsliced.length > 0) {
            throw new Error(`adaptive split enabled but ${unsliced.length} items still reference icons.webp`);
          }
          const tileReferenced = iconSpriteItems.filter((item) => item.iconSprite.url.includes('/tiles/') || item.iconSprite.url.startsWith('tiles/'));
          if (tileReferenced.length === 0) {
            throw new Error('adaptive split enabled but no item references tile assets');
          }
          console.log(`Adaptive split validation passed: tiles=${manifest.tiles.length}, tileReferences=${tileReferenced.length}, manifest=${manifestPath}`);
          NODE

      - name: Update upstream snapshot
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cat > UPSTREAM_SNAPSHOT.json <<EOF
          {
            "upstreamRepository": "https://github.com/endfield-calc/factoriolab/tree/ark-endfield-3rd-test",
            "upstreamCommit": "${{ steps.upstream.outputs.sha }}",
            "generatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Skip build when upstream unchanged
        if: steps.check.outputs.should_build != 'true'
        run: |
          set -euo pipefail
          echo "Skipping build and commit."
          echo "Workflow event: ${{ github.event_name }}"
          echo "force_update: ${{ github.event_name == 'workflow_dispatch' && inputs.force_update || false }}"
          echo "upstream commit: ${{ steps.upstream.outputs.sha }}"
          echo "previous commit: ${{ steps.previous.outputs.sha }}"
          echo "force build: ${{ steps.check.outputs.force_build }}"
          echo "decision reason: ${{ steps.check.outputs.reason }}"

      - name: Commit and push changes
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_LICENSE NOTICE.md UPSTREAM_SNAPSHOT.json dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync from upstream ${{ steps.upstream.outputs.sha }}"
          git push
